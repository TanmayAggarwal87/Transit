[project]
name = "transit-ai-service"
version = "0.1.0"
description = "Transit AI Service"
authors = [
    {name = "Transit Team"}
]
requires-python = ">=3.15"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "aiokafka (>=0.15.0,<0.16.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "greenlet (>=3.5.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

